server {
    listen 80 default_server;
    server_name app.licitaro.com.br gestao.licitaro.com.br;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { default_type text/plain; return 503 'Licitaro: HTTPS em configuracao.'; }
}
