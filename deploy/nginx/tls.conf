resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80 default_server;
    server_name app.licitaro.com.br gestao.licitaro.com.br;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.licitaro.com.br;
    ssl_certificate /etc/letsencrypt/live/licitaro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/licitaro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    root /srv/app;
    location /api/ {
        set $backend api:3000;
        proxy_pass http://$backend;
        include /etc/licitaro-nginx/proxy.conf;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control 'no-cache' always; }
    location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
}
server {
    listen 443 ssl;
    server_name gestao.licitaro.com.br;
    ssl_certificate /etc/letsencrypt/live/licitaro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/licitaro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    root /srv/console;
    location /api/ {
        set $backend console-api:3001;
        proxy_pass http://$backend;
        include /etc/licitaro-nginx/proxy.conf;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control 'no-cache' always; }
    location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
}
