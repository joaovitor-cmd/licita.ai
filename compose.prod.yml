name: licitaro
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-api: &api
  <<: *common
  image: licitaro-api:${RELEASE_TAG:-initial}
  build:
    context: .
    target: api
  env_file: .env.production
  environment:
    NODE_ENV: production
    APP_URL: https://app.licitaro.com.br
    WEB_ORIGIN: https://app.licitaro.com.br
    CONSOLE_ORIGIN: https://gestao.licitaro.com.br
    API_HOST: 0.0.0.0
    CONSOLE_API_HOST: 0.0.0.0
    PORT: "3000"
    CONSOLE_PORT: "3001"
    TRUST_PROXY_HOPS: "1"
  volumes:
    - ./deploy/secrets:/run/licitaro-secrets:ro
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s
services:
  api:
    <<: *api
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
  console-api:
    <<: *api
    command: [node, apps/api/dist/console-index.js]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
  nginx:
    <<: *common
    image: licitaro-nginx:${RELEASE_TAG:-initial}
    build:
      context: .
      target: nginx
      args:
        VITE_CONSOLE_URL: https://gestao.licitaro.com.br
    ports: ["80:80", "443:443"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
  certbot:
    <<: *common
    image: certbot/certbot:v5.8.0
    profiles: [tls]
    entrypoint: [/bin/sh, /opt/licitaro/renew.sh]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot
      - ./deploy/scripts/renew.sh:/opt/licitaro/renew.sh:ro
volumes:
  letsencrypt:
  acme:
